<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Invoice App</title>
   
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 960px;
        }
        .card {
            margin-bottom: 1.5rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .table th, .table td {
            vertical-align: middle;
        }
        .table tfoot th {
            border-top: 2px solid #dee2e6;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center mb-4 text-primary">Customer Invoice Generator</h1>

        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Customer Information</h5>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="customerName" class="form-label">Customer Name</label>
                        <input type="text" class="form-control" id="customerName" placeholder="Enter customer name">
                    </div>
                    <div class="col-md-6">
                        <label for="customerEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="customerEmail" placeholder="customer@example.com">
                    </div>
                    <div class="col-12">
                        <label for="customerAddress" class="form-label">Address</label>
                        <input type="text" class="form-control" id="customerAddress" placeholder="1234 Main St">
                    </div>
                    <div class="col-md-6">
                        <label for="customerCity" class="form-label">City</label>
                        <input type="text" class="form-control" id="customerCity" placeholder="Anytown">
                    </div>
                    <div class="col-md-4">
                        <label for="customerState" class="form-label">State</label>
                        <input type="text" class="form-control" id="customerState" placeholder="CA">
                    </div>
                    <div class="col-md-2">
                        <label for="customerZip" class="form-label">Zip</label>
                        <input type="text" class="form-control" id="customerZip" placeholder="90210">
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Invoice Details</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-bordered align-middle">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Description</th>
                                <th scope="col" class="text-end">Quantity</th>
                                <th scope="col" class="text-end">Price</th>
                                <th scope="col" class="text-end">Total</th>
                                <th scope="col" class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="invoiceItems">
                            <tr>
                                <td>1</td>
                                <td><input type="text" class="form-control" value="Product A"></td>
                                <td><input type="number" class="form-control text-end" value="2" min="1"></td>
                                <td><div class="input-group"><span class="input-group-text">$</span><input type="number" class="form-control text-end" value="10.00" min="0"></div></td>
                                <td class="text-end fw-bold">$20.00</td>
                                <td class="text-center"><button id=irem1" class="btn btn-danger btn-sm">Remove</button></td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td><input type="text" class="form-control" value="Service B"></td>
                                <td><input type="number" class="form-control text-end" value="1" min="1"></td>
                                <td><div class="input-group"><span class="input-group-text">$</span><input type="number" class="form-control text-end" value="50.00" min="0"></div></td>
                                <td class="text-end fw-bold">$50.00</td>
                                <td class="text-center"><button id=irem2" class="btn btn-danger btn-sm">Remove</button></td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="6" class="text-end p-3">
                                    <button class="btn btn-success" id="addItemBtn">Add Item</button>
                                </td>
                            </tr>
                            <tr>
                                <th colspan="4" class="text-end">Subtotal:</th>
                                <td id="subTotal" class="text-end fw-bold">$70.00</td>
                                <td></td>
                            </tr>
                            <tr>
                                <th colspan="4" class="text-end">Tax:</th>
                                <td class="text-end">
                                    <div class="input-group justify-content-end">
                                        <input id="tax" type="number" class="form-control text-end" value="10" min="0" max="100" style="max-width: 80px;">
                                        <span class="input-group-text">%</span>
                                    </div>
                                </td>
                                <td id="totalTax" class="text-end fw-bold">$7.00</td>
                            </tr>
                            <tr>
                                <th colspan="4" class="text-end fs-5">Total:</th>
                                <td colspan="2" id="total" class="text-end fs-5 fw-bold text-primary">$77.00</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-body text-center">
                <button id="generateInv" class="btn btn-primary btn-lg me-2">Generate Invoice</button>
                <button id="printInv" class="btn btn-secondary btn-lg me-2">Print Invoice</button>
                <button id="clearInv" class="btn btn-warning btn-lg">Clear All</button>
            </div>
        </div>
    </div>
